<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolfram Elementary CA</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; image-rendering: pixelated; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button, select { background: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; font-family: monospace; margin-top: 5px; }
        button:hover, select:hover { background: #45a049; }
        label { display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Wolfram Elementary CA</h2>
        <p>A 1D cellular automaton that generates complex patterns from simple rules (e.g., Rule 30, Rule 90).</p>
        <label>Rule: 
            <select id="ruleSelect" onchange="init()">
                <option value="30">Rule 30 (Chaos)</option>
                <option value="90">Rule 90 (Sierpinski)</option>
                <option value="110">Rule 110 (Turing Complete)</option>
                <option value="184">Rule 184 (Traffic/Surface)</option>
            </select>
        </label>
        <button onclick="init()">Restart</button>
        <br><br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const ruleSelect = document.getElementById('ruleSelect');
        
        const cellSize = 2;
        let cols, rows;
        let cells = [];
        let generation = 0;
        let ruleset = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width / cellSize);
            rows = Math.floor(canvas.height / cellSize);
            init();
        }

        function setRule(ruleNum) {
            ruleset = [];
            let binaryStr = ruleNum.toString(2).padStart(8, '0');
            for (let i = 0; i < 8; i++) {
                ruleset.push(parseInt(binaryStr[7 - i]));
            }
        }

        function init() {
            setRule(parseInt(ruleSelect.value));
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            cells = new Array(cols).fill(0);
            cells[Math.floor(cols / 2)] = 1; // Single cell in the middle
            generation = 0;
            drawRow();
        }

        function generate() {
            let nextgen = new Array(cols).fill(0);
            for (let i = 0; i < cols; i++) {
                let left = cells[(i - 1 + cols) % cols];
                let middle = cells[i];
                let right = cells[(i + 1) % cols];
                nextgen[i] = applyRule(left, middle, right);
            }
            cells = nextgen;
            generation++;
        }

        function applyRule(a, b, c) {
            let s = "" + a + b + c;
            let index = parseInt(s, 2);
            return ruleset[index];
        }

        function drawRow() {
            if (generation >= rows) {
                // Shift image up to scroll
                let imgData = ctx.getImageData(0, cellSize, canvas.width, canvas.height - cellSize);
                ctx.putImageData(imgData, 0, 0);
                // Clear bottom row
                ctx.fillStyle = '#111';
                ctx.fillRect(0, canvas.height - cellSize, canvas.width, cellSize);
                generation--; // Keep it at bottom
            }

            for (let i = 0; i < cols; i++) {
                if (cells[i] === 1) {
                    ctx.fillStyle = '#eee';
                    ctx.fillRect(i * cellSize, generation * cellSize, cellSize, cellSize);
                }
            }
        }

        function loop() {
            generate();
            drawRow();
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize(); // Calls init
        loop();
    </script>
</body>
</html>
