<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ASCII DLA Model</title>
  <style>
    body { background: #10120f; color: #e5eadb; font-family: monospace; margin: 20px; }
    pre { color: #76c7d5; }
    h1 { color: #76c7d5; font-size: 16px; }
  </style>
</head>
<body>
  <h1>ASCII DLA (Diffusion-Limited Aggregation)</h1>
  <p>Share script: <code>curl https://example.invalid/alife/ascii_dla.py | python3</code></p>
  <pre id="field"></pre>
  <script>
    const W = 60, H = 30;
    let grid = Array.from({length: H}, () => Array.from({length: W}, () => 0));
    grid[Math.floor(H/2)][Math.floor(W/2)] = 1; // seed
    let particles = [];
    for(let i=0; i<60; i++) spawnParticle();

    function spawnParticle() {
      let x, y;
      if(Math.random() < 0.5) { x = Math.random() < 0.5 ? 0 : W-1; y = Math.floor(Math.random()*H); }
      else { x = Math.floor(Math.random()*W); y = Math.random() < 0.5 ? 0 : H-1; }
      particles.push({x, y});
    }

    function step() {
      // Multiple steps per frame to speed up the slow DLA process
      for(let iter=0; iter<3; iter++) {
        for(let i=particles.length-1; i>=0; i--) {
          let p = particles[i];
          p.x = (p.x + Math.floor(Math.random()*3)-1 + W) % W;
          p.y = (p.y + Math.floor(Math.random()*3)-1 + H) % H;

          let touches = false;
          for(let dy=-1; dy<=1 && !touches; dy++) {
            for(let dx=-1; dx<=1 && !touches; dx++) {
              if(dx===0 && dy===0) continue;
              let nx = (p.x+dx+W)%W, ny = (p.y+dy+H)%H;
              if(grid[ny][nx] === 1) touches = true;
            }
          }
          if(touches) {
            grid[p.y][p.x] = 1;
            particles.splice(i, 1);
            spawnParticle();
          }
        }
      }

      let render = grid.map(arr => [...arr]);
      for(let p of particles) render[p.y][p.x] = 2; // moving

      document.getElementById('field').textContent = render.map(row => row.map(c => {
        if(c === 1) return '#';
        if(c === 2) return '.';
        return ' ';
      }).join('')).join('\n');
    }
    setInterval(step, 40);
  </script>
</body>
</html>
