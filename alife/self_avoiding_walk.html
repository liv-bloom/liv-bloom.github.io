<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Avoiding Walk</title>
    <style>
        body { margin: 0; background-color: #10120f; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; color: #e5eadb; }
        canvas { display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(16,18,15,0.8); padding: 10px; border: 1px solid #394034; border-radius: 4px; pointer-events: none; }
        a { color: #8fd46b; text-decoration: none; pointer-events: auto; }
        a:hover { text-decoration: underline; }
        .controls { margin-top: 5px; font-size: 12px; pointer-events: auto; }
        button { background: #394034; color: #e5eadb; border: 1px solid #8fd46b; padding: 2px 5px; cursor: pointer; font-family: monospace; margin-right: 5px; }
        button:hover { background: #8fd46b; color: #10120f; }
    </style>
</head>
<body>
    <div id="info">
        <h2 style="margin: 0 0 5px 0; color: #8fd46b;">Self-Avoiding Walk</h2>
        <p style="margin: 0 0 10px 0; font-size: 12px; max-width: 300px;">A random walk on a grid that never crosses its own path. Often used to model polymer chains. If it gets trapped, it starts a new color.</p>
        <div class="controls">
            <button onclick="reset()">Restart</button>
        </div>
        <br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const CELL_SIZE = 5;
        let cols, rows;
        let grid;
        let currentX, currentY;
        let path = [];
        let hues = [120, 200, 300, 60, 0, 40]; // Base hues for different paths
        let colorIndex = 0;

        function resize() {
            const minDim = Math.min(window.innerWidth, window.innerHeight) - 40;
            width = minDim;
            height = minDim;
            canvas.width = width;
            canvas.height = height;
            cols = Math.floor(width / CELL_SIZE);
            rows = Math.floor(height / CELL_SIZE);
            reset();
        }

        function reset() {
            grid = new Array(cols).fill(0).map(() => new Array(rows).fill(false));
            currentX = Math.floor(cols / 2);
            currentY = Math.floor(rows / 2);
            grid[currentX][currentY] = true;
            path = [{x: currentX, y: currentY}];
            colorIndex = 0;
            
            ctx.fillStyle = '#10120f';
            ctx.fillRect(0, 0, width, height);
        }

        function getOptions(x, y) {
            let options = [];
            if (x > 0 && !grid[x-1][y]) options.push({dx: -1, dy: 0});
            if (x < cols-1 && !grid[x+1][y]) options.push({dx: 1, dy: 0});
            if (y > 0 && !grid[x][y-1]) options.push({dx: 0, dy: -1});
            if (y < rows-1 && !grid[x][y+1]) options.push({dx: 0, dy: 1});
            return options;
        }

        function step() {
            // Do multiple steps per frame to speed up
            for (let i = 0; i < 50; i++) {
                let options = getOptions(currentX, currentY);
                
                if (options.length === 0) {
                    // Trapped. Find a new empty spot to start
                    let found = false;
                    for (let tr = 0; tr < 100; tr++) {
                        let rx = Math.floor(Math.random() * cols);
                        let ry = Math.floor(Math.random() * rows);
                        if (!grid[rx][ry]) {
                            currentX = rx;
                            currentY = ry;
                            grid[currentX][currentY] = true;
                            path = [{x: currentX, y: currentY}];
                            colorIndex = (colorIndex + 1) % hues.length;
                            found = true;
                            break;
                        }
                    }
                    if (!found) return; // Board mostly full
                    continue;
                }

                let choice = options[Math.floor(Math.random() * options.length)];
                let nextX = currentX + choice.dx;
                let nextY = currentY + choice.dy;

                // Draw line segment
                ctx.strokeStyle = `hsl(${hues[colorIndex]}, 80%, 60%)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(currentX * CELL_SIZE + CELL_SIZE/2, currentY * CELL_SIZE + CELL_SIZE/2);
                ctx.lineTo(nextX * CELL_SIZE + CELL_SIZE/2, nextY * CELL_SIZE + CELL_SIZE/2);
                ctx.stroke();

                currentX = nextX;
                currentY = nextY;
                grid[currentX][currentY] = true;
            }
        }

        function draw() {
            step();
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
