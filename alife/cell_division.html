<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Division (Mitosis)</title>
    <style>
        body { margin: 0; background-color: #10120f; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; color: #e5eadb; }
        canvas { display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(16,18,15,0.8); padding: 10px; border: 1px solid #394034; border-radius: 4px; pointer-events: none; }
        a { color: #8fd46b; text-decoration: none; pointer-events: auto; }
        a:hover { text-decoration: underline; }
        .controls { margin-top: 5px; font-size: 12px; pointer-events: auto; }
        button { background: #394034; color: #e5eadb; border: 1px solid #8fd46b; padding: 2px 5px; cursor: pointer; font-family: monospace; margin-right: 5px; }
        button:hover { background: #8fd46b; color: #10120f; }
    </style>
</head>
<body>
    <div id="info">
        <h2 style="margin: 0 0 5px 0; color: #8fd46b;">Cell Division (Mitosis)</h2>
        <p style="margin: 0 0 10px 0; font-size: 12px; max-width: 300px;">A 2D physics model of tissue growth. Cells slowly grow and undergo mitosis when they reach a threshold size. Repulsion forces pack them tightly like real biological cells.</p>
        <div class="controls">
            <button onclick="reset()">Restart</button>
        </div>
        <br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let cells = [];
        const MAX_CELLS = 400;
        const SPLIT_RADIUS = 20;
        const MIN_RADIUS = 8;
        const GROWTH_RATE = 0.04;
        
        // Base hue for the tissue
        const BASE_HUE = 140;

        function resize() {
            const minDim = Math.min(window.innerWidth, window.innerHeight) - 40;
            width = minDim;
            height = minDim;
            canvas.width = width;
            canvas.height = height;
            reset();
        }

        class Cell {
            constructor(x, y, r, hue) {
                this.x = x;
                this.y = y;
                this.r = r;
                this.vx = 0;
                this.vy = 0;
                this.hue = hue;
                this.splitCooldown = 60; // frames before it can split again
            }

            update() {
                if (this.splitCooldown > 0) this.splitCooldown--;
                
                // Grow
                if (this.r < SPLIT_RADIUS + 2) {
                    this.r += GROWTH_RATE;
                }
                
                // Physics (friction and velocity)
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.7; // high friction (like viscous fluid)
                this.vy *= 0.7;
                
                // Contain within circle slightly smaller than canvas
                let dx = this.x - width/2;
                let dy = this.y - height/2;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let containerRadius = width/2 - 20;
                if (dist + this.r > containerRadius) {
                    let force = (dist + this.r - containerRadius) * 0.1;
                    this.vx -= (dx/dist) * force;
                    this.vy -= (dy/dist) * force;
                }
            }

            divide() {
                // Split area in half: pi*r^2 / 2 -> new_r = r / sqrt(2)
                let newR = this.r / Math.sqrt(2);
                if (newR < MIN_RADIUS) return false;
                
                this.r = newR;
                this.splitCooldown = 60;
                
                // Slight hue mutation
                let newHue = this.hue + (Math.random() * 20 - 10);
                
                // Angle of division
                let angle = Math.random() * Math.PI * 2;
                let offset = newR * 0.5;
                
                let child = new Cell(
                    this.x + Math.cos(angle) * offset,
                    this.y + Math.sin(angle) * offset,
                    newR,
                    newHue
                );
                
                this.x -= Math.cos(angle) * offset;
                this.y -= Math.sin(angle) * offset;
                
                cells.push(child);
                return true;
            }

            draw() {
                ctx.fillStyle = `hsl(${this.hue}, 60%, 50%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw nucleus
                ctx.fillStyle = `hsl(${this.hue}, 40%, 30%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#10120f';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function resolveCollisions() {
            for (let i = 0; i < cells.length; i++) {
                for (let j = i + 1; j < cells.length; j++) {
                    let c1 = cells[i];
                    let c2 = cells[j];
                    let dx = c2.x - c1.x;
                    let dy = c2.y - c1.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let minDist = c1.r + c2.r;
                    
                    if (dist < minDist && dist > 0) {
                        let overlap = minDist - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;
                        // Repulsion force
                        let force = overlap * 0.1;
                        c1.vx -= nx * force;
                        c1.vy -= ny * force;
                        c2.vx += nx * force;
                        c2.vy += ny * force;
                    }
                }
            }
        }

        function reset() {
            cells = [];
            cells.push(new Cell(width/2, height/2, MIN_RADIUS * 1.5, BASE_HUE));
        }

        function draw() {
            ctx.fillStyle = '#10120f';
            ctx.fillRect(0, 0, width, height);

            resolveCollisions();
            
            // Draw background boundary
            ctx.strokeStyle = '#394034';
            ctx.beginPath();
            ctx.arc(width/2, height/2, width/2 - 20, 0, Math.PI * 2);
            ctx.stroke();

            for (let i = cells.length - 1; i >= 0; i--) {
                let c = cells[i];
                c.update();
                c.draw();
                
                // Check if ready to divide
                if (c.r >= SPLIT_RADIUS && cells.length < MAX_CELLS && c.splitCooldown <= 0) {
                    c.divide();
                }
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
