<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion-Limited Aggregation (DLA)</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; image-rendering: pixelated; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { background: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; font-family: monospace; margin-top: 5px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Diffusion-Limited Aggregation (DLA)</h2>
        <p>Particles undergo random walks and stick together when they touch, forming fractal structures like snowflakes, lightning, or mineral deposits.</p>
        <button onclick="init()">Reset Cluster</button>
        <br><br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let grid = [];
        let walkers = [];
        const numWalkers = 1500;
        const stepsPerFrame = 200;
        let clusterRadius = 5;

        function resize() {
            width = Math.min(window.innerWidth, window.innerHeight);
            height = width;
            canvas.width = width;
            canvas.height = height;
            init();
        }

        class Walker {
            constructor() {
                this.reset();
            }

            reset() {
                // Spawn on a circle just outside the current cluster radius
                let angle = Math.random() * Math.PI * 2;
                let r = Math.min(clusterRadius + 20, width / 2 - 5);
                this.x = Math.floor(width / 2 + Math.cos(angle) * r);
                this.y = Math.floor(height / 2 + Math.sin(angle) * r);
            }

            walk() {
                let dir = Math.floor(Math.random() * 4);
                if (dir === 0) this.x++;
                else if (dir === 1) this.x--;
                else if (dir === 2) this.y++;
                else if (dir === 3) this.y--;

                // Constrain
                if (this.x < 0 || this.x >= width || this.y < 0 || this.y >= height) {
                    this.reset(); // out of bounds, respawn
                }
            }

            checkStuck() {
                if (this.x <= 0 || this.x >= width - 1 || this.y <= 0 || this.y >= height - 1) return false;
                
                // Check neighbors
                if (grid[this.x + 1][this.y] || 
                    grid[this.x - 1][this.y] || 
                    grid[this.x][this.y + 1] || 
                    grid[this.x][this.y - 1] ||
                    grid[this.x + 1][this.y + 1] || 
                    grid[this.x - 1][this.y - 1] || 
                    grid[this.x + 1][this.y - 1] || 
                    grid[this.x - 1][this.y + 1]) {
                    
                    grid[this.x][this.y] = true;
                    
                    // Update cluster radius
                    let dx = this.x - width / 2;
                    let dy = this.y - height / 2;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > clusterRadius) {
                        clusterRadius = dist;
                    }
                    
                    // Draw
                    let distRatio = Math.min(1, dist / (width / 2));
                    ctx.fillStyle = `hsl(${distRatio * 360}, 80%, 60%)`;
                    ctx.fillRect(this.x, this.y, 1, 1);
                    
                    return true;
                }
                return false;
            }
        }

        function init() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);
            
            grid = new Array(width).fill(false).map(() => new Array(height).fill(false));
            
            // Seed center
            let cx = Math.floor(width / 2);
            let cy = Math.floor(height / 2);
            grid[cx][cy] = true;
            ctx.fillStyle = '#fff';
            ctx.fillRect(cx, cy, 1, 1);
            
            clusterRadius = 5;
            walkers = [];
            for (let i = 0; i < numWalkers; i++) {
                walkers.push(new Walker());
            }
        }

        function draw() {
            if (clusterRadius > width / 2 - 10) {
                // Growth complete
                requestAnimationFrame(draw);
                return;
            }

            for (let s = 0; s < stepsPerFrame; s++) {
                for (let i = 0; i < walkers.length; i++) {
                    let w = walkers[i];
                    w.walk();
                    if (w.checkStuck()) {
                        w.reset();
                    }
                }
            }
            
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
