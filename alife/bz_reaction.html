<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belousov-Zhabotinsky Reaction</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; image-rendering: pixelated; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { background: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; font-family: monospace; margin-top: 5px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="info">
        <h2>BZ Reaction</h2>
        <p>A cellular automaton model of the Belousov-Zhabotinsky oscillating chemical reaction, producing spiral waves.</p>
        <button onclick="init()">Reset</button>
        <br><br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const size = 150;
        let grid = [];
        let nextGrid = [];
        
        // Parameters for the BZ reaction
        const states = 255;
        const alpha = 1.2;
        const beta = 1.0;
        const gamma = 1.0;

        function resize() {
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            canvas.width = size;
            canvas.height = size;
            canvas.style.width = minDim + 'px';
            canvas.style.height = minDim + 'px';
        }

        function init() {
            grid = [];
            nextGrid = [];
            for (let x = 0; x < size; x++) {
                grid[x] = [];
                nextGrid[x] = [];
                for (let y = 0; y < size; y++) {
                    grid[x][y] = {
                        a: Math.random(),
                        b: Math.random(),
                        c: Math.random()
                    };
                    nextGrid[x][y] = { a: 0, b: 0, c: 0 };
                }
            }
        }

        function update() {
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    let cell = grid[x][y];
                    
                    let a_sum = 0, b_sum = 0, c_sum = 0;
                    
                    // Moore neighborhood average
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            let nx = (x + i + size) % size;
                            let ny = (y + j + size) % size;
                            a_sum += grid[nx][ny].a;
                            b_sum += grid[nx][ny].b;
                            c_sum += grid[nx][ny].c;
                        }
                    }
                    
                    let a_avg = a_sum / 9;
                    let b_avg = b_sum / 9;
                    let c_avg = c_sum / 9;

                    nextGrid[x][y].a = Math.max(0, Math.min(1, a_avg + a_avg * (alpha * b_avg - gamma * c_avg)));
                    nextGrid[x][y].b = Math.max(0, Math.min(1, b_avg + b_avg * (beta * c_avg - alpha * a_avg)));
                    nextGrid[x][y].c = Math.max(0, Math.min(1, c_avg + c_avg * (gamma * a_avg - beta * b_avg)));
                }
            }
            
            // Swap grids
            let temp = grid;
            grid = nextGrid;
            nextGrid = temp;
        }

        function draw() {
            update();
            update(); // Double speed
            
            let imgData = ctx.createImageData(size, size);
            
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    let idx = (y * size + x) * 4;
                    let cell = grid[x][y];
                    
                    imgData.data[idx + 0] = Math.floor(cell.a * 255); // R
                    imgData.data[idx + 1] = Math.floor(cell.b * 255); // G
                    imgData.data[idx + 2] = Math.floor(cell.c * 255); // B
                    imgData.data[idx + 3] = 255; // Alpha
                }
            }
            
            ctx.putImageData(imgData, 0, 0);
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        init();
        draw();
    </script>
</body>
</html>
