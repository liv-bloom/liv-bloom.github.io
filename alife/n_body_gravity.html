<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Body Gravity Simulation</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { background: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; font-family: monospace; margin-top: 5px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="info">
        <h2>N-Body Gravity</h2>
        <p>A simulation of gravitational attraction between multiple bodies in a closed system.</p>
        <button onclick="init()">Reset System</button>
        <br><br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let bodies = [];
        const numBodies = 150;
        const G = 0.5; // Gravitational constant
        const maxVelocity = 5;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        class Body {
            constructor() {
                this.x = canvas.width / 2 + (Math.random() - 0.5) * canvas.width * 0.5;
                this.y = canvas.height / 2 + (Math.random() - 0.5) * canvas.height * 0.5;
                
                // Initial orbital velocity approximation
                let dx = this.x - canvas.width / 2;
                let dy = this.y - canvas.height / 2;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                this.vx = (dy / dist) * (Math.random() * 2 + 1);
                this.vy = -(dx / dist) * (Math.random() * 2 + 1);
                
                this.mass = Math.random() * 3 + 1;
                this.color = `hsl(${Math.random() * 60 + 200}, 80%, 60%)`;
                
                // Add a massive central body occasionally
                if (bodies.length === 0) {
                    this.x = canvas.width / 2;
                    this.y = canvas.height / 2;
                    this.vx = 0;
                    this.vy = 0;
                    this.mass = 300;
                    this.color = '#ffcc00';
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(1, Math.sqrt(this.mass)), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            bodies = [];
            for (let i = 0; i < numBodies; i++) {
                bodies.push(new Body());
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(17, 17, 17, 0.2)'; // trailing effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calculate gravity interactions
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    let b1 = bodies[i];
                    let b2 = bodies[j];
                    
                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let distSq = dx * dx + dy * dy;
                    
                    // Softening parameter to avoid extreme forces at close range
                    let dist = Math.sqrt(distSq) + 5; 
                    
                    let force = (G * b1.mass * b2.mass) / (distSq + 25);
                    
                    let fx = (force * dx) / dist;
                    let fy = (force * dy) / dist;
                    
                    b1.vx += fx / b1.mass;
                    b1.vy += fy / b1.mass;
                    
                    b2.vx -= fx / b2.mass;
                    b2.vy -= fy / b2.mass;
                }
            }

            // Update and draw
            for (let i = 0; i < bodies.length; i++) {
                let b = bodies[i];
                
                // Optional: boundary conditions or wrap
                if (b.x < -100 || b.x > canvas.width + 100 || b.y < -100 || b.y > canvas.height + 100) {
                    b.mass = 0; // kill off escaped particles effectively
                }
                
                b.update();
                if (b.mass > 0) b.draw();
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        init();
        draw();
    </script>
</body>
</html>
