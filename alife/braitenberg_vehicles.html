<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braitenberg Vehicles</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { background: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; font-family: monospace; margin-top: 5px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Braitenberg Vehicles</h2>
        <p>Simple agents showing complex behavior (fear, aggression, love) based on sensor-motor wiring.</p>
        <button onclick="addLight()">Add Light</button>
        <button onclick="addVehicle('fear')">Add Fear Vehicle</button>
        <button onclick="addVehicle('aggression')">Add Aggression Vehicle</button>
        <button onclick="addVehicle('love')">Add Love Vehicle</button>
        <button onclick="addVehicle('explorer')">Add Explorer Vehicle</button>
        <button onclick="reset()">Clear</button>
        <br><br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let lights = [];
        let vehicles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function reset() {
            lights = [];
            vehicles = [];
        }

        function addLight() {
            lights.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                intensity: 200
            });
        }

        // Types:
        // 'fear': straight connections (L->L, R->R), positive. Runs away from light.
        // 'aggression': crossed connections (L->R, R->L), positive. Charges at light.
        // 'love': straight connections (L->L, R->R), negative. Stops near light.
        // 'explorer': crossed connections (L->R, R->L), negative. Turns away and explores.
        function addVehicle(type) {
            vehicles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                angle: Math.random() * Math.PI * 2,
                type: type,
                v: 0,
                vl: 0,
                vr: 0,
                color: type === 'fear' ? '#f44' : type === 'aggression' ? '#f4f' : type === 'love' ? '#4f4' : '#44f'
            });
        }

        function update() {
            const dt = 0.1;
            const sensorAngle = 0.5; // radians
            const sensorDist = 15;
            const maxSpeed = 10;
            const baseSpeed = 1;

            vehicles.forEach(v => {
                let sl_x = v.x + Math.cos(v.angle - sensorAngle) * sensorDist;
                let sl_y = v.y + Math.sin(v.angle - sensorAngle) * sensorDist;
                let sr_x = v.x + Math.cos(v.angle + sensorAngle) * sensorDist;
                let sr_y = v.y + Math.sin(v.angle + sensorAngle) * sensorDist;

                let sl_val = 0;
                let sr_val = 0;

                lights.forEach(l => {
                    let dl = Math.hypot(l.x - sl_x, l.y - sl_y);
                    let dr = Math.hypot(l.x - sr_x, l.y - sr_y);
                    if(dl < 5) dl = 5;
                    if(dr < 5) dr = 5;
                    sl_val += l.intensity / (dl * dl);
                    sr_val += l.intensity / (dr * dr);
                });

                // Scale up
                sl_val *= 100;
                sr_val *= 100;

                let ml = baseSpeed;
                let mr = baseSpeed;

                if (v.type === 'fear') {
                    ml += sl_val;
                    mr += sr_val;
                } else if (v.type === 'aggression') {
                    ml += sr_val;
                    mr += sl_val;
                } else if (v.type === 'love') {
                    ml += (10 - sl_val);
                    mr += (10 - sr_val);
                } else if (v.type === 'explorer') {
                    ml += (10 - sr_val);
                    mr += (10 - sl_val);
                }

                if (ml > maxSpeed) ml = maxSpeed;
                if (mr > maxSpeed) mr = maxSpeed;
                if (ml < -maxSpeed) ml = -maxSpeed;
                if (mr < -maxSpeed) mr = -maxSpeed;

                v.vl = ml;
                v.vr = mr;

                let v_center = (v.vl + v.vr) / 2;
                let omega = (v.vr - v.vl) / (sensorDist * 2);

                v.angle += omega * dt;
                v.x += Math.cos(v.angle) * v_center * dt * 10;
                v.y += Math.sin(v.angle) * v_center * dt * 10;

                // Wrap around
                if (v.x < 0) v.x += canvas.width;
                if (v.x > canvas.width) v.x -= canvas.width;
                if (v.y < 0) v.y += canvas.height;
                if (v.y > canvas.height) v.y -= canvas.height;
            });
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw lights
            lights.forEach(l => {
                let grad = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, 100);
                grad.addColorStop(0, 'rgba(255, 255, 100, 0.8)');
                grad.addColorStop(1, 'rgba(255, 255, 100, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(l.x, l.y, 100, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.arc(l.x, l.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw vehicles
            vehicles.forEach(v => {
                ctx.save();
                ctx.translate(v.x, v.y);
                ctx.rotate(v.angle);
                
                // Body
                ctx.fillStyle = v.color;
                ctx.fillRect(-10, -8, 20, 16);
                
                // Wheels
                ctx.fillStyle = '#555';
                ctx.fillRect(-8, -10, 10, 4);
                ctx.fillRect(-8, 6, 10, 4);

                // Sensors
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(10, -5, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(10, 5, 3, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        
        // Initial setup
        resize();
        addLight();
        addVehicle('fear');
        addVehicle('aggression');
        addVehicle('love');
        addVehicle('explorer');
        
        loop();
    </script>
</body>
</html>
