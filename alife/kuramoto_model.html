<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuramoto Model (Synchronization)</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        label { display: block; margin-top: 5px; }
        input[type=range] { vertical-align: middle; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Kuramoto Model</h2>
        <p>A mathematical model of synchronization among coupled oscillators, resembling fireflies syncing their flashes.</p>
        <label>Coupling (K): <input type="range" id="couplingSlider" min="0" max="100" value="40"></label>
        <label>Radius (r): <input type="range" id="radiusSlider" min="10" max="200" value="80"></label>
        <br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const couplingSlider = document.getElementById('couplingSlider');
        const radiusSlider = document.getElementById('radiusSlider');
        
        const numFireflies = 400;
        let fireflies = [];
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        class Firefly {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.phase = Math.random() * Math.PI * 2;
                // Natural frequency (normally distributed around a mean)
                this.omega = 0.05 + (Math.random() + Math.random() + Math.random() - 1.5) * 0.01;
            }

            move() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Bounce off edges
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                
                // Keep strictly inside to prevent getting stuck
                this.x = Math.max(0, Math.min(canvas.width, this.x));
                this.y = Math.max(0, Math.min(canvas.height, this.y));
            }

            draw() {
                // Brightness peaks when phase is near 0 or 2PI (cos(phase) is near 1)
                let brightness = (Math.cos(this.phase) + 1) / 2; // Range 0 to 1
                
                // Draw glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4 + brightness * 6, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 255, 100, ${brightness * 0.8})`;
                ctx.fill();
                
                // Draw core
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + brightness * 0.8})`;
                ctx.fill();
            }
        }

        function init() {
            fireflies = [];
            for (let i = 0; i < numFireflies; i++) {
                fireflies.push(new Firefly());
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(17, 17, 17, 0.4)'; // trail effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const K = couplingSlider.value / 1000; // Scale down for stability
            const radius = radiusSlider.value;
            const rSq = radius * radius;

            // Compute phase updates
            let newPhases = new Array(numFireflies);
            
            // Spatial Kuramoto Model interaction
            for (let i = 0; i < numFireflies; i++) {
                let f1 = fireflies[i];
                let sumSin = 0;
                let neighbors = 0;
                
                for (let j = 0; j < numFireflies; j++) {
                    if (i === j) continue;
                    let f2 = fireflies[j];
                    
                    let dx = f2.x - f1.x;
                    let dy = f2.y - f1.y;
                    if (dx*dx + dy*dy < rSq) {
                        sumSin += Math.sin(f2.phase - f1.phase);
                        neighbors++;
                    }
                }
                
                let coupling = neighbors > 0 ? (K * sumSin / neighbors) : 0;
                newPhases[i] = f1.phase + f1.omega + coupling;
            }

            // Apply updates and draw
            for (let i = 0; i < numFireflies; i++) {
                fireflies[i].phase = newPhases[i] % (Math.PI * 2);
                if (fireflies[i].phase < 0) fireflies[i].phase += Math.PI * 2;
                fireflies[i].move();
                fireflies[i].draw();
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        init();
        draw();
    </script>
</body>
</html>
