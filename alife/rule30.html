<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D Cellular Automaton (Rule 30)</title>
    <style>
        body { margin: 0; background-color: #10120f; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; color: #e5eadb; }
        canvas { display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); image-rendering: pixelated; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(16,18,15,0.8); padding: 10px; border: 1px solid #394034; border-radius: 4px; pointer-events: none; }
        a { color: #8fd46b; text-decoration: none; pointer-events: auto; }
        a:hover { text-decoration: underline; }
        .controls { margin-top: 5px; font-size: 12px; pointer-events: auto; }
        button { background: #394034; color: #e5eadb; border: 1px solid #8fd46b; padding: 2px 5px; cursor: pointer; font-family: monospace; margin-right: 5px; }
        button:hover { background: #8fd46b; color: #10120f; }
    </style>
</head>
<body>
    <div id="info">
        <h2 style="margin: 0 0 5px 0; color: #8fd46b;">Rule 30</h2>
        <p style="margin: 0 0 10px 0; font-size: 12px; max-width: 300px;">A one-dimensional cellular automaton introduced by Stephen Wolfram. From a single black cell, it generates a complex, chaotic, and seemingly random fractal pattern.</p>
        <div class="controls">
            <button onclick="reset()">Restart</button>
        </div>
        <br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let scale = 2;
        let cols, rows;
        let generation = 0;
        let cells = [];

        // Rule 30 logic:
        // 111 -> 0, 110 -> 0, 101 -> 0, 100 -> 1, 011 -> 1, 010 -> 1, 001 -> 1, 000 -> 0
        const ruleset = [0, 1, 1, 1, 1, 0, 0, 0];

        function resize() {
            const minDim = Math.min(window.innerWidth, window.innerHeight) - 40;
            cols = Math.floor(minDim / scale);
            rows = Math.floor(minDim / scale);
            canvas.width = cols * scale;
            canvas.height = rows * scale;
            reset();
        }

        function reset() {
            ctx.fillStyle = '#10120f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            cells = new Array(cols).fill(0);
            cells[Math.floor(cols / 2)] = 1; // Initial state: middle cell is 1
            generation = 0;
        }

        function draw() {
            if (generation < rows) {
                // Draw current generation
                for (let i = 0; i < cols; i++) {
                    if (cells[i] === 1) {
                        ctx.fillStyle = '#8fd46b';
                        ctx.fillRect(i * scale, generation * scale, scale, scale);
                    }
                }

                // Compute next generation
                let nextGen = new Array(cols).fill(0);
                for (let i = 0; i < cols; i++) {
                    let left = cells[(i - 1 + cols) % cols];
                    let middle = cells[i];
                    let right = cells[(i + 1) % cols];
                    
                    let stateStr = "" + left + middle + right;
                    let stateIndex = parseInt(stateStr, 2);
                    nextGen[i] = ruleset[stateIndex];
                }
                
                cells = nextGen;
                generation++;
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
