<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Swarm Optimization</title>
    <style>
        body { margin: 0; background-color: #10120f; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; color: #e5eadb; }
        canvas { display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(16,18,15,0.8); padding: 10px; border: 1px solid #394034; border-radius: 4px; pointer-events: none; }
        a { color: #8fd46b; text-decoration: none; pointer-events: auto; }
        a:hover { text-decoration: underline; }
        .controls { margin-top: 5px; font-size: 12px; pointer-events: auto; }
        button { background: #394034; color: #e5eadb; border: 1px solid #8fd46b; padding: 2px 5px; cursor: pointer; font-family: monospace; margin-right: 5px; }
        button:hover { background: #8fd46b; color: #10120f; }
    </style>
</head>
<body>
    <div id="info">
        <h2 style="margin: 0 0 5px 0; color: #8fd46b;">Particle Swarm Optimization (PSO)</h2>
        <p style="margin: 0 0 10px 0; font-size: 12px; max-width: 300px;">A swarm intelligence algorithm where particles search for an optimal target (light green). Click anywhere to move the target.</p>
        <div class="controls">
            <button onclick="reset()">Restart</button>
        </div>
        <br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let globalBest = { x: 0, y: 0, fitness: Infinity };
        let target = { x: 0, y: 0 };
        const NUM_PARTICLES = 100;
        
        // PSO Parameters
        const w = 0.5; // Inertia weight
        const c1 = 1.5; // Cognitive (personal best) weight
        const c2 = 1.5; // Social (global best) weight

        function resize() {
            const minDim = Math.min(window.innerWidth, window.innerHeight) - 40;
            width = minDim;
            height = minDim;
            canvas.width = width;
            canvas.height = height;
            target.x = width / 2;
            target.y = height / 2;
            reset();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.bestX = this.x;
                this.bestY = this.y;
                this.bestFitness = Infinity;
            }

            evaluate() {
                // Fitness is distance squared to the target
                let dx = this.x - target.x;
                let dy = this.y - target.y;
                let fitness = dx*dx + dy*dy;
                
                if (fitness < this.bestFitness) {
                    this.bestFitness = fitness;
                    this.bestX = this.x;
                    this.bestY = this.y;
                }
                
                if (fitness < globalBest.fitness) {
                    globalBest.fitness = fitness;
                    globalBest.x = this.x;
                    globalBest.y = this.y;
                }
            }

            update() {
                // Update velocity
                let r1 = Math.random();
                let r2 = Math.random();
                
                this.vx = w * this.vx + 
                          c1 * r1 * (this.bestX - this.x) + 
                          c2 * r2 * (globalBest.x - this.x);
                          
                this.vy = w * this.vy + 
                          c1 * r1 * (this.bestY - this.y) + 
                          c2 * r2 * (globalBest.y - this.y);
                
                // Speed limit
                let speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                if (speed > 10) {
                    this.vx = (this.vx / speed) * 10;
                    this.vy = (this.vy / speed) * 10;
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.fillStyle = 'rgba(143, 212, 107, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function reset() {
            particles = [];
            globalBest = { x: 0, y: 0, fitness: Infinity };
            for (let i = 0; i < NUM_PARTICLES; i++) {
                particles.push(new Particle());
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            target.x = e.clientX - rect.left;
            target.y = e.clientY - rect.top;
            globalBest.fitness = Infinity; // Reset global best to allow them to find new target
            for (let p of particles) {
                p.bestFitness = Infinity; // Reset personal bests too
            }
        });

        function draw() {
            // Motion blur effect
            ctx.fillStyle = 'rgba(16, 18, 15, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Draw target
            ctx.fillStyle = '#8fd46b';
            ctx.beginPath();
            ctx.arc(target.x, target.y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#e5eadb';
            ctx.lineWidth = 1;
            ctx.stroke();

            for (let p of particles) {
                p.evaluate();
            }
            
            for (let p of particles) {
                p.update();
                p.draw();
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
