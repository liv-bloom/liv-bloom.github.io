<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ASCII BML Traffic Model</title>
  <style>
    body { background: #10120f; color: #e5eadb; font-family: monospace; margin: 20px; }
    pre { color: #f3d36b; }
    h1 { color: #8fd46b; font-size: 16px; }
  </style>
</head>
<body>
  <h1>ASCII BML Traffic Model</h1>
  <p>Share script: <code>curl https://example.invalid/alife/ascii_bml.py | python3</code></p>
  <pre id="field"></pre>
  <script>
    const W = 60, H = 30;
    const EMPTY = 0, RIGHT = 1, DOWN = 2;
    const DENSITY = 0.35; // Around 35% often shows the phase transition between free flow and global jam

    let grid = Array.from({length: H}, () => Array.from({length: W}, () => {
      let r = Math.random();
      if(r < DENSITY / 2) return RIGHT;
      if(r < DENSITY) return DOWN;
      return EMPTY;
    }));

    let turn = 0;

    function step() {
      let nextGrid = grid.map(arr => [...arr]);
      let moved = false;

      if(turn % 2 === 0) {
        // Red cars (RIGHT) move east
        for(let y=0; y<H; y++) {
          for(let x=0; x<W; x++) {
            if(grid[y][x] === RIGHT) {
              let nx = (x + 1) % W;
              if(grid[y][nx] === EMPTY) {
                nextGrid[y][nx] = RIGHT;
                nextGrid[y][x] = EMPTY;
                moved = true;
              }
            }
          }
        }
      } else {
        // Blue cars (DOWN) move south
        for(let y=0; y<H; y++) {
          for(let x=0; x<W; x++) {
            if(grid[y][x] === DOWN) {
              let ny = (y + 1) % H;
              if(grid[ny][x] === EMPTY) {
                nextGrid[ny][x] = DOWN;
                nextGrid[y][x] = EMPTY;
                moved = true;
              }
            }
          }
        }
      }

      grid = nextGrid;
      turn++;

      document.getElementById('field').textContent = grid.map(row => row.map(c => {
        if(c === RIGHT) return '>'; // Red equivalent
        if(c === DOWN) return 'v';  // Blue equivalent
        return ' ';
      }).join('')).join('\n');
    }
    setInterval(step, 80);
  </script>
</body>
</html>
