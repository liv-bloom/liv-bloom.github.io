<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot Set</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Mandelbrot Set</h2>
        <p>The iconic boundary of infinite complexity.</p>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let zoom = 1;
        let offsetX = -0.5;
        let offsetY = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawMandelbrot();
        }

        function drawMandelbrot() {
            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            const maxIter = 100;

            for (let x = 0; x < width; x++) {
                for (let y = 0; y < height; y++) {
                    let cx = 1.5 * (x - width / 2) / (0.5 * zoom * width) + offsetX;
                    let cy = (y - height / 2) / (0.5 * zoom * height) + offsetY;
                    
                    let zx = 0;
                    let zy = 0;
                    let i = 0;
                    
                    while (zx * zx + zy * zy < 4 && i < maxIter) {
                        let tmp = zx * zx - zy * zy + cx;
                        zy = 2.0 * zx * zy + cy;
                        zx = tmp;
                        i++;
                    }

                    const px = (x + y * width) * 4;
                    if (i === maxIter) {
                        data[px] = 0;
                        data[px + 1] = 0;
                        data[px + 2] = 0;
                        data[px + 3] = 255;
                    } else {
                        const c = (i / maxIter) * 255;
                        data[px] = c;
                        data[px + 1] = c * 0.4;
                        data[px + 2] = c * 0.8;
                        data[px + 3] = 255;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
