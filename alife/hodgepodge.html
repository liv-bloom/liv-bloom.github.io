<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ASCII Hodgepodge Machine</title>
  <style>
    body { background: #10120f; color: #e5eadb; font-family: monospace; margin: 20px; }
    pre { color: #f3d36b; }
    h1 { color: #8fd46b; font-size: 16px; }
  </style>
</head>
<body>
  <h1>ASCII Hodgepodge Machine (BZ Reaction Analog)</h1>
  <p>Share script: <code>curl https://example.invalid/alife/ascii_hodgepodge.py | python3</code></p>
  <pre id="field"></pre>
  <script>
    const W = 60, H = 30;
    const N = 100; // States 0 to N
    let grid = Array.from({length: H}, () => Array.from({length: W}, () => Math.floor(Math.random() * N)));

    const K1 = 2, K2 = 3, G = 34;

    function step() {
      let next = Array.from({length: H}, () => Array.from({length: W}, () => 0));
      for(let y=0; y<H; y++) {
        for(let x=0; x<W; x++) {
          let c = grid[y][x];
          if (c === N) {
            next[y][x] = 0;
          } else if (c === 0) {
            let inf = 0, ill = 0;
            for(let dy=-1; dy<=1; dy++) {
              for(let dx=-1; dx<=1; dx++) {
                if(dx===0 && dy===0) continue;
                let st = grid[(y+dy+H)%H][(x+dx+W)%W];
                if(st > 0 && st < N) inf++;
                if(st === N) ill++;
              }
            }
            next[y][x] = Math.floor(inf/K1) + Math.floor(ill/K2);
          } else {
            let sum = 0, ill = 0, inf = 0;
            for(let dy=-1; dy<=1; dy++) {
              for(let dx=-1; dx<=1; dx++) {
                if(dx===0 && dy===0) continue;
                let st = grid[(y+dy+H)%H][(x+dx+W)%W];
                sum += st;
                if(st > 0 && st < N) inf++;
                if(st === N) ill++;
              }
            }
            next[y][x] = Math.min(N, Math.floor(c + sum / (inf + ill + 1) + G));
          }
        }
      }
      grid = next;
      const chars = " .:-=+*#%@";
      document.getElementById('field').textContent = grid.map(row => row.map(c => {
        let idx = Math.floor((c / N) * (chars.length - 1));
        return chars[Math.max(0, Math.min(chars.length-1, idx))];
      }).join('')).join('\n');
    }
    setInterval(step, 80);
  </script>
</body>
</html>
