<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilingual Garden - Grid View</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10120f;
      --panel: #181d18;
      --ink: #e5eadb;
      --green: #8fd46b;
      --line: #394034;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: var(--green);
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .frame-container {
      border: 1px solid var(--line);
      background: var(--panel);
      position: relative;
      padding-top: 75%; /* 4:3 Aspect Ratio */
      overflow: hidden;
      border-radius: 4px;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      /* Scale down the content slightly so it fits nicely */
      transform: scale(0.85);
      transform-origin: 0 0;
      width: 117.6%; /* 100 / 0.85 */
      height: 117.6%;
      pointer-events: none; /* prevent scrolling inside iframes */
    }
    .overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(16, 18, 15, 0.8);
      padding: 5px 10px;
      font-size: 12px;
      color: var(--green);
      backdrop-filter: blur(2px);
    }
    .nav {
      text-align: center;
      margin-bottom: 20px;
    }
    .nav a {
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 5px 15px;
      border-radius: 3px;
      font-size: 14px;
    }
    .nav a:hover {
      border-color: var(--green);
    }
  </style>
</head>
<body>
  <h1>Bilingual Garden - Grid View</h1>
  <div class="nav">
    <a href="index.html">← Back to Index</a>
  </div>
  <div class="grid" id="gallery">
    <!-- Top 9 models to prevent browser crash -->
  </div>

  <script>
    const models = [
      { url: 'boids.html', title: 'Boids Field' },
      { url: 'conway.html', title: 'Game of Life' },
      { url: 'slime_mold.html', title: 'Slime Mold' },
      { url: 'reaction_diffusion.html', title: 'Reaction-Diffusion' },
      { url: 'sandpile.html', title: 'Abelian Sandpile' },
      { url: 'hodgepodge.html', title: 'Hodgepodge Machine' },
      { url: 'voter_model.html', title: 'Voter Model' },
      { url: 'wator.html', title: 'Wa-Tor' },
      { url: 'ising_model.html', title: 'Ising Model' }
    ];

    const gallery = document.getElementById('gallery');
    
    models.forEach(m => {
      const div = document.createElement('div');
      div.className = 'frame-container';
      
      const iframe = document.createElement('iframe');
      iframe.src = m.url;
      
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.textContent = m.title;
      
      div.appendChild(iframe);
      div.appendChild(overlay);
      gallery.appendChild(div);
    });
  </script>
</body>
</html>
