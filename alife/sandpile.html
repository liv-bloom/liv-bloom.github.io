<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ASCII Abelian Sandpile</title>
  <style>
    body { background: #10120f; color: #e5eadb; font-family: monospace; margin: 20px; }
    pre { line-height: 1.1; letter-spacing: 2px; }
    h1 { color: #f3d36b; font-size: 16px; }
  </style>
</head>
<body>
  <h1>ASCII Abelian Sandpile Model</h1>
  <p>Share script: <code>curl https://example.invalid/alife/sandpile.py | python3</code></p>
  <pre id="field"></pre>
  <script>
    const W = 50, H = 50;
    let grid = Array.from({length: H}, () => Array.from({length: W}, () => 0));
    
    // Drop a large amount of sand in the center initially
    grid[Math.floor(H/2)][Math.floor(W/2)] = 10000;

    const colors = ["#10120f", "#394034", "#718465", "#8fd46b"];

    function step() {
      // Speed up visual by multiple toppling passes per frame
      for(let pass = 0; pass < 20; pass++) {
        let next = Array.from({length: H}, () => Array.from({length: W}, () => 0));
        let active = false;
        
        for(let y=0; y<H; y++) {
          for(let x=0; x<W; x++) {
            next[y][x] += grid[y][x];
            if(grid[y][x] >= 4) {
              active = true;
              let topple = Math.floor(grid[y][x] / 4);
              next[y][x] -= topple * 4;
              
              if(y > 0) next[y-1][x] += topple;
              if(y < H-1) next[y+1][x] += topple;
              if(x > 0) next[y][x-1] += topple;
              if(x < W-1) next[y][x+1] += topple;
            }
          }
        }
        grid = next;
        
        // Add random grains of sand occasionally to maintain criticality
        if(!active) {
            grid[Math.floor(H/2)][Math.floor(W/2)] += 100;
        }
      }
      
      let out = "";
      for(let y=0; y<H; y++) {
        let row = "";
        for(let x=0; x<W; x++) {
          let v = grid[y][x];
          if(v === 0) row += '<span style="color:'+colors[0]+';">.</span>';
          else if(v === 1) row += '<span style="color:'+colors[1]+';">1</span>';
          else if(v === 2) row += '<span style="color:'+colors[2]+';">2</span>';
          else if(v === 3) row += '<span style="color:'+colors[3]+';">3</span>';
          else row += '<span style="color:#e77a61;">*</span>'; // toppling
        }
        out += row + "\n";
      }
      document.getElementById('field').innerHTML = out;
    }
    
    setInterval(step, 100);
  </script>
</body>
</html>
