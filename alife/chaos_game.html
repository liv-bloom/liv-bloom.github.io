<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Game (Sierpinski)</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Chaos Game</h2>
        <p>Emergence of a Sierpinski Triangle from purely random choices.</p>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const vertices = [];
        const padding = 50;

        function initVertices() {
            vertices.length = 0;
            // Equilateral triangle
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 50;
            const r = Math.min(canvas.width, canvas.height) / 2 - padding;

            for (let i = 0; i < 3; i++) {
                const angle = -Math.PI / 2 + (i * 2 * Math.PI / 3);
                vertices.push({
                    x: cx + r * Math.cos(angle),
                    y: cy + r * Math.sin(angle)
                });
            }
        }

        initVertices();

        let currentPoint = {
            x: canvas.width / 2,
            y: canvas.height / 2
        };

        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw vertices
        ctx.fillStyle = '#ff4040';
        vertices.forEach(v => {
            ctx.beginPath();
            ctx.arc(v.x, v.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.fillStyle = 'rgba(76, 175, 80, 0.5)';

        function loop() {
            for (let i = 0; i < 100; i++) {
                const target = vertices[Math.floor(Math.random() * vertices.length)];
                currentPoint.x = (currentPoint.x + target.x) / 2;
                currentPoint.y = (currentPoint.y + target.y) / 2;

                ctx.fillRect(currentPoint.x, currentPoint.y, 1, 1);
            }
            requestAnimationFrame(loop);
        }

        loop();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            initVertices();
            ctx.fillStyle = '#ff4040';
            vertices.forEach(v => {
                ctx.beginPath();
                ctx.arc(v.x, v.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.fillStyle = 'rgba(76, 175, 80, 0.5)';
            currentPoint = { x: canvas.width / 2, y: canvas.height / 2 };
        });
    </script>
</body>
</html>
