<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-System Fractal Plant</title>
    <style>
        body { margin: 0; background-color: #111; color: #eee; font-family: monospace; overflow: hidden; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #333; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { background: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; font-family: monospace; margin-top: 5px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="info">
        <h2>L-System Fractal Plant</h2>
        <p>Recursive plant growth using Lindenmayer system grammars.</p>
        <button onclick="generate()">Grow</button>
        <button onclick="reset()">Reset</button>
        <br><br>
        <a href="index.html">← Back to Gallery</a>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Axiom and Rules (Fractal weed)
        const axiom = "X";
        const rules = {
            "X": "F+[[X]-X]-F[-FX]+X",
            "F": "FF"
        };
        
        let sentence = axiom;
        const angle = 25 * Math.PI / 180;
        let generations = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }

        function generate() {
            if (generations >= 6) return; // Limit to prevent freezing
            let nextSentence = "";
            for (let i = 0; i < sentence.length; i++) {
                const char = sentence.charAt(i);
                nextSentence += rules[char] || char;
            }
            sentence = nextSentence;
            generations++;
            draw();
        }

        function reset() {
            sentence = axiom;
            generations = 0;
            draw();
            // Start with a few generations
            generate();
            generate();
            generate();
            generate();
            generate();
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = `hsl(120, 60%, 50%)`;
            ctx.lineWidth = 1;
            
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height);
            
            // Adjust length dynamically
            let currentLen = (canvas.height / 3.5) / Math.pow(2, generations - 1);
            if (currentLen < 2) currentLen = 2;

            for (let i = 0; i < sentence.length; i++) {
                const char = sentence.charAt(i);
                
                if (char === "F") {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, -currentLen);
                    ctx.stroke();
                    ctx.translate(0, -currentLen);
                } else if (char === "+") {
                    ctx.rotate(angle);
                } else if (char === "-") {
                    ctx.rotate(-angle);
                } else if (char === "[") {
                    ctx.save();
                } else if (char === "]") {
                    ctx.restore();
                }
            }
            
            ctx.restore();
        }

        window.addEventListener('resize', resize);
        resize();
        reset(); // Initializes with 5 generations
    </script>
</body>
</html>
