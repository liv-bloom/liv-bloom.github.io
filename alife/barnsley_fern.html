<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barnsley Fern</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #eee; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { border: 1px solid #333; background-color: #000; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .controls { margin-top: 10px; display: flex; gap: 15px; }
        button { background: #333; color: #eee; border: 1px solid #555; padding: 5px 10px; cursor: pointer; font-family: monospace; }
        button:hover { background: #444; }
        #info { margin-bottom: 10px; font-size: 1.1em; color: #aaa; text-align: center; }
    </style>
</head>
<body>
    <div id="info">Barnsley Fern (Iterated Function System)</div>
    <canvas id="canvas" width="600" height="600"></canvas>
    <div class="controls">
        <button onclick="reset()">Reset</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        let x = 0;
        let y = 0;

        function reset() {
            ctx.fillStyle = 'rgba(0, 0, 0, 1.0)';
            ctx.fillRect(0, 0, width, height);
            x = 0;
            y = 0;
        }

        function draw() {
            for (let i = 0; i < 500; i++) {
                let nextX, nextY;
                let r = Math.random();

                if (r < 0.01) {
                    nextX = 0;
                    nextY = 0.16 * y;
                } else if (r < 0.86) {
                    nextX = 0.85 * x + 0.04 * y;
                    nextY = -0.04 * x + 0.85 * y + 1.60;
                } else if (r < 0.93) {
                    nextX = 0.20 * x - 0.26 * y;
                    nextY = 0.23 * x + 0.22 * y + 1.60;
                } else {
                    nextX = -0.15 * x + 0.28 * y;
                    nextY = 0.26 * x + 0.24 * y + 0.44;
                }

                x = nextX;
                y = nextY;

                let drawX = width / 2 + x * (width / 11);
                let drawY = height - y * (height / 11);

                ctx.fillStyle = 'rgba(50, 200, 50, 0.5)';
                ctx.fillRect(drawX, drawY, 1, 1);
            }
            requestAnimationFrame(draw);
        }

        reset();
        draw();
    </script>
</body>
</html>
