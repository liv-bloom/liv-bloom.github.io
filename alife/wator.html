<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ASCII Wa-Tor</title>
  <style>
    body { background: #10120f; color: #e5eadb; font-family: monospace; margin: 20px; }
    pre { line-height: 1.1; letter-spacing: 2px; }
    h1 { color: #61a1b4; font-size: 16px; }
  </style>
</head>
<body>
  <h1>ASCII Wa-Tor (Ecological Simulation)</h1>
  <p>Share script: <code>curl https://example.invalid/alife/wator.py | python3</code></p>
  <pre id="field"></pre>
  <script>
    const W = 60, H = 30;
    // 0: empty, 1: fish, 2: shark
    let grid = Array.from({length: H}, () => Array.from({length: W}, () => 0));
    let fish_age = Array.from({length: H}, () => Array.from({length: W}, () => 0));
    let shark_energy = Array.from({length: H}, () => Array.from({length: W}, () => 0));
    
    const FISH_BREED = 5;
    const SHARK_BREED = 12;
    const SHARK_ENERGY = 4;

    for(let y=0; y<H; y++) {
      for(let x=0; x<W; x++) {
        let r = Math.random();
        if(r < 0.05) {
          grid[y][x] = 2;
          shark_energy[y][x] = SHARK_ENERGY;
        } else if(r < 0.3) {
          grid[y][x] = 1;
        }
      }
    }

    function step() {
      let moved = Array.from({length: H}, () => Array.from({length: W}, () => false));
      
      // Fish move
      for(let y=0; y<H; y++) {
        for(let x=0; x<W; x++) {
          if(grid[y][x] === 1 && !moved[y][x]) {
            fish_age[y][x]++;
            let adj = [];
            if(grid[(y-1+H)%H][x] === 0) adj.push([(y-1+H)%H, x]);
            if(grid[(y+1)%H][x] === 0) adj.push([(y+1)%H, x]);
            if(grid[y][(x-1+W)%W] === 0) adj.push([y, (x-1+W)%W]);
            if(grid[y][(x+1)%W] === 0) adj.push([y, (x+1)%W]);
            
            if(adj.length > 0) {
              let [ny, nx] = adj[Math.floor(Math.random() * adj.length)];
              grid[ny][nx] = 1;
              moved[ny][nx] = true;
              if(fish_age[y][x] >= FISH_BREED) {
                fish_age[ny][nx] = 0;
                fish_age[y][x] = 0;
                // Old cell stays fish
              } else {
                fish_age[ny][nx] = fish_age[y][x];
                grid[y][x] = 0;
                fish_age[y][x] = 0;
              }
            }
          }
        }
      }

      // Shark move
      for(let y=0; y<H; y++) {
        for(let x=0; x<W; x++) {
          if(grid[y][x] === 2 && !moved[y][x]) {
            shark_energy[y][x]--;
            if(shark_energy[y][x] <= 0) {
              grid[y][x] = 0;
              continue;
            }
            fish_age[y][x]++; // repurpose fish_age array for shark breeding age
            
            let fishes = [], empty = [];
            if(grid[(y-1+H)%H][x] === 1) fishes.push([(y-1+H)%H, x]);
            else if(grid[(y-1+H)%H][x] === 0) empty.push([(y-1+H)%H, x]);
            
            if(grid[(y+1)%H][x] === 1) fishes.push([(y+1)%H, x]);
            else if(grid[(y+1)%H][x] === 0) empty.push([(y+1)%H, x]);
            
            if(grid[y][(x-1+W)%W] === 1) fishes.push([y, (x-1+W)%W]);
            else if(grid[y][(x-1+W)%W] === 0) empty.push([y, (x-1+W)%W]);
            
            if(grid[y][(x+1)%W] === 1) fishes.push([y, (x+1)%W]);
            else if(grid[y][(x+1)%W] === 0) empty.push([y, (x+1)%W]);
            
            let dest = null;
            if(fishes.length > 0) {
              dest = fishes[Math.floor(Math.random() * fishes.length)];
              shark_energy[y][x] += SHARK_ENERGY;
            } else if(empty.length > 0) {
              dest = empty[Math.floor(Math.random() * empty.length)];
            }
            
            if(dest) {
              let [ny, nx] = dest;
              grid[ny][nx] = 2;
              shark_energy[ny][nx] = shark_energy[y][x];
              moved[ny][nx] = true;
              
              if(fish_age[y][x] >= SHARK_BREED) {
                fish_age[ny][nx] = 0;
                fish_age[y][x] = 0;
                shark_energy[y][x] = SHARK_ENERGY / 2;
                // Old cell stays shark
              } else {
                fish_age[ny][nx] = fish_age[y][x];
                grid[y][x] = 0;
                fish_age[y][x] = 0;
              }
            }
          }
        }
      }

      let out = "";
      for(let y=0; y<H; y++) {
        let row = "";
        for(let x=0; x<W; x++) {
          if(grid[y][x] === 1) row += '<span style="color:#76c7d5;">o</span>';
          else if(grid[y][x] === 2) row += '<span style="color:#e77a61;">X</span>';
          else row += '<span style="color:#1e323b;">.</span>';
        }
        out += row + "\n";
      }
      document.getElementById('field').innerHTML = out;
    }
    setInterval(step, 150);
  </script>
</body>
</html>
