<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenhouse Seed: Echo Chamber (Isolation CA)</title>
  <style>
    body { background-color: #050505; color: #8fd46b; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
    pre { font-size: 10px; line-height: 10px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <pre id="canvas"></pre>
  <script>
    const width = 80;
    const height = 60;
    // 0: empty, 1: opinion A, 2: opinion B
    let grid = new Array(height).fill(0).map(() => new Array(width).fill(0));
    
    // Seed with random noise
    for(let y=0; y<height; y++) {
      for(let x=0; x<width; x++) {
        if(Math.random() < 0.3) {
           grid[y][x] = Math.random() < 0.5 ? 1 : 2;
        }
      }
    }
    
    const display = document.getElementById('canvas');
    
    function update() {
      let nextGrid = new Array(height).fill(0).map(() => new Array(width).fill(0));
      let out = '';
      
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let state = grid[y][x];
          
          let count1 = 0;
          let count2 = 0;
          for(let dy=-1; dy<=1; dy++) {
            for(let dx=-1; dx<=1; dx++) {
              if(dy===0 && dx===0) continue;
              let ny = (y+dy+height)%height;
              let nx = (x+dx+width)%width;
              if (grid[ny][nx] === 1) count1++;
              if (grid[ny][nx] === 2) count2++;
            }
          }
          
          if (state !== 0) {
            // If exposed to too many of the OPPOSITE opinion, it dies (retreats)
            let oppositeCount = (state === 1) ? count2 : count1;
            let sameCount = (state === 1) ? count1 : count2;
            
            if (oppositeCount > 2) {
              nextGrid[y][x] = 0; // Death by exposure
            } else if (sameCount >= 2) {
              nextGrid[y][x] = state; // Reinforced by echo chamber
            } else {
              nextGrid[y][x] = 0; // Death by isolation
            }
          } else {
            // Empty space can be colonized if strongly surrounded by ONE opinion
            if (count1 > 2 && count2 === 0) nextGrid[y][x] = 1;
            else if (count2 > 2 && count1 === 0) nextGrid[y][x] = 2;
            else nextGrid[y][x] = 0;
          }
          
          if (nextGrid[y][x] === 1) out += 'O';
          else if (nextGrid[y][x] === 2) out += 'X';
          else out += ' ';
        }
        out += '\n';
      }
      grid = nextGrid;
      display.textContent = out;
      requestAnimationFrame(update);
    }
    
    update();
  </script>
</body>
</html>
