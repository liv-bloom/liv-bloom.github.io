<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALife Seed: Reaction-Diffusion (Gray-Scott)</title>
    <style>
        body {
            background-color: #000000;
            color: #4CAF50;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #grid {
            white-space: pre;
            line-height: 10px; /* Reduced line-height for squarer aspect */
            letter-spacing: 2px;
            font-size: 10px;
            cursor: crosshair;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="grid"></div>
    <div class="info">
        > Reaction-Diffusion (Gray-Scott)<br>
        > f=0.055, k=0.062 (Coral growth)<br>
        > Click/Drag to drop Chemical B (Metabolic Trace)
    </div>

    <script>
        const COLS = 80;
        const ROWS = 60;
        const CHARS = [' ', '.', ':', '-', '=', '+', '*', '#', '%', '@'];
        
        let gridA = new Float32Array(COLS * ROWS);
        let gridB = new Float32Array(COLS * ROWS);
        let nextA = new Float32Array(COLS * ROWS);
        let nextB = new Float32Array(COLS * ROWS);

        // Parameters for coral-like growth
        const Da = 1.0;
        const Db = 0.5;
        const f = 0.055;
        const k = 0.062;
        const dt = 1.0;

        function idx(x, y) {
            // Toroidal wrap
            const wx = (x + COLS) % COLS;
            const wy = (y + ROWS) % ROWS;
            return wy * COLS + wx;
        }

        function init() {
            for (let i = 0; i < COLS * ROWS; i++) {
                gridA[i] = 1.0;
                gridB[i] = 0.0;
            }
            // Seed
            const cx = Math.floor(COLS / 2);
            const cy = Math.floor(ROWS / 2);
            for (let y = cy - 3; y <= cy + 3; y++) {
                for (let x = cx - 3; x <= cx + 3; x++) {
                    gridB[idx(x, y)] = 1.0;
                }
            }
        }

        function update() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const i = idx(x, y);
                    const a = gridA[i];
                    const b = gridB[i];

                    const lapA = (gridA[idx(x-1, y)] + gridA[idx(x+1, y)] + gridA[idx(x, y-1)] + gridA[idx(x, y+1)] - 4 * a);
                    const lapB = (gridB[idx(x-1, y)] + gridB[idx(x+1, y)] + gridB[idx(x, y-1)] + gridB[idx(x, y+1)] - 4 * b);

                    const reaction = a * b * b;

                    nextA[i] = a + (Da * lapA - reaction + f * (1 - a)) * dt;
                    nextB[i] = b + (Db * lapB + reaction - (k + f) * b) * dt;

                    // Constrain
                    if (nextA[i] > 1) nextA[i] = 1;
                    if (nextA[i] < 0) nextA[i] = 0;
                    if (nextB[i] > 1) nextB[i] = 1;
                    if (nextB[i] < 0) nextB[i] = 0;
                }
            }

            // Swap
            let tempA = gridA; gridA = nextA; nextA = tempA;
            let tempB = gridB; gridB = nextB; nextB = tempB;
        }

        function render() {
            let html = "";
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const val = gridB[idx(x, y)];
                    const charIdx = Math.floor(val * (CHARS.length - 1));
                    
                    // Add some color variation based on concentration
                    if (val > 0.5) {
                        html += `<span style="color: #8BC34A">${CHARS[charIdx]}</span>`;
                    } else if (val > 0.2) {
                        html += `<span style="color: #4CAF50">${CHARS[charIdx]}</span>`;
                    } else if (val > 0.05) {
                        html += `<span style="color: #388E3C">${CHARS[charIdx]}</span>`;
                    } else {
                        html += CHARS[charIdx];
                    }
                }
                html += "\n";
            }
            document.getElementById('grid').innerHTML = html;
        }

        function dropChemical(clientX, clientY) {
            const el = document.getElementById('grid');
            const rect = el.getBoundingClientRect();
            
            // Very rough mapping from pixel to grid
            const xPct = (clientX - rect.left) / rect.width;
            const yPct = (clientY - rect.top) / rect.height;
            
            const gridX = Math.floor(xPct * COLS);
            const gridY = Math.floor(yPct * ROWS);
            
            if (gridX >= 0 && gridX < COLS && gridY >= 0 && gridY < ROWS) {
                // Drop a block of chemical B
                for(let dy=-1; dy<=1; dy++) {
                    for(let dx=-1; dx<=1; dx++) {
                        gridB[idx(gridX+dx, gridY+dy)] = 1.0;
                    }
                }
            }
        }

        document.addEventListener('mousedown', (e) => {
            dropChemical(e.clientX, e.clientY);
            document.addEventListener('mousemove', onMouseMove);
        });
        
        document.addEventListener('mouseup', () => {
            document.removeEventListener('mousemove', onMouseMove);
        });

        function onMouseMove(e) {
            dropChemical(e.clientX, e.clientY);
        }

        init();
        setInterval(() => {
            // Run multiple updates per frame to speed up the slow R-D process
            for(let i=0; i<5; i++) update();
            render();
        }, 50);

    </script>
</body>
</html>
