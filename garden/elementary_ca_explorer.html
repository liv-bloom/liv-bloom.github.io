<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elementary Cellular Automaton Explorer</title>
    <style>
        body {
            background-color: #10120f;
            color: #e5eadb;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        pre {
            line-height: 1em;
            letter-spacing: 0;
            font-size: min(1.8vw, 12px);
            user-select: none;
        }
        #info {
            max-width: 600px; 
            margin-top: 10px; 
            font-size: 12px; 
            text-align: left;
        }
        .controls {
            margin-top: 10px;
        }
        input, button {
            background-color: #181d18;
            color: #e5eadb;
            border: 1px solid #394034;
            padding: 4px 8px;
            font-family: inherit;
        }
        button:hover {
            border-color: #8fd46b;
            color: #8fd46b;
        }
    </style>
</head>
<body>
    <pre id="canvas"></pre>
    <div id="info">
        <strong>Wolfram's Elementary Cellular Automata</strong><br>
        1D cellular automata discovered by Stephen Wolfram. Each cell's state depends only on its previous state and its two neighbors.<br>
        Rule 30: Chaotic. Rule 90: Sierpinski triangle. Rule 110: Turing complete.<br>
        <div class="controls">
            Rule (0-255): <input type="number" id="ruleInput" min="0" max="255" value="30" style="width:50px;">
            <button onclick="applyRule()">Generate</button>
            <button onclick="randomRule()">Random</button>
        </div>
    </div>

    <script>
        const COLS = 80;
        const ROWS = 60;
        const canvas = document.getElementById("canvas");
        const ruleInput = document.getElementById("ruleInput");

        // Green text on dark background
        const chars = [".", "O"];
        const colors = ["#2b2b1a", "#8fd46b"];

        let grid = new Uint8Array(COLS * ROWS);
        let ruleSet = [];

        function getRuleSet(rule) {
            let rs = [];
            for (let i = 7; i >= 0; i--) {
                rs.push((rule >> i) & 1);
            }
            return rs;
        }

        function generate() {
            grid.fill(0);
            // Seed center of first row
            grid[Math.floor(COLS / 2)] = 1;

            for (let y = 1; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let left = grid[(y - 1) * COLS + ((x - 1 + COLS) % COLS)];
                    let middle = grid[(y - 1) * COLS + x];
                    let right = grid[(y - 1) * COLS + ((x + 1) % COLS)];
                    
                    let state = (left << 2) | (middle << 1) | right;
                    grid[y * COLS + x] = ruleSet[7 - state];
                }
            }
            draw();
        }

        function draw() {
            let html = "";
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let val = grid[y * COLS + x];
                    let fw = val ? "font-weight:bold;" : "";
                    html += `<span style="color:${colors[val]}; ${fw}">${chars[val]}</span>`;
                }
                html += "\n";
            }
            canvas.innerHTML = html;
        }

        function applyRule() {
            let rule = parseInt(ruleInput.value);
            if (isNaN(rule) || rule < 0 || rule > 255) rule = 30;
            ruleInput.value = rule;
            ruleSet = getRuleSet(rule);
            generate();
        }

        function randomRule() {
            ruleInput.value = Math.floor(Math.random() * 256);
            applyRule();
        }

        // Init
        applyRule();
    </script>
</body>
</html>
